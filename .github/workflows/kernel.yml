name: kernel

# grus (Xiaomi Mi 9 SE, SDM710) kernel build on Linux.
#
# The XNU kernel is built with the UniXNU Linux toolchain container (Fedora 44 + a patched
# LLVM, cctools ld64, MIG, iig, lzfse and the xcrun/plutil/codesign shims from
# scripts/linux of UniXNU). This avoids the macOS + Xcode requirement of the original port and
# runs on the free GitHub Linux runner.

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device repository ref (defaults to the ref of this run)
        required: false
        default: ""
      unixnu_ref:
        description: UniXNU ref to build with
        required: false
        # Pinned to the last upstream state known-good with sirius CI (2026-10-27);
        # later main force-pushed the ArmCpu submodule pin away ("not our ref").
        default: "120067ccc43ebb5e76ec62c9219a48c897052838"
      steps:
        description: Steps to build
        type: choice
        options:
          - kernel
          - kernel payload
        default: "kernel"
      pre_build:
        description: Optional shell commands run in the UniXNU checkout before the kernel build
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "board.toml"
      - "dts/**"
      - "scripts/**"
      - "package/**"
      - "kits/**"
      - "patches/**"
      - "drivers/**"
      - "uboot/**"
      - "efi/**"
      - ".github/workflows/kernel.yml"

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  UNIXNU_DEVICE: ${{ github.workspace }}/device

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref || '120067ccc43ebb5e76ec62c9219a48c897052838' }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.device_ref || github.ref }}
          path: device
          persist-credentials: false

      # The U-Boot submodule pin of 57UU/u-boot was force-pushed away ("not our ref").
      # The kernel/payload steps never use it (U-Boot only builds the boot image), so drop it.
      - name: Drop the unused U-Boot submodule
        run: |
          git -C device rm --cached uboot/src
          rm -rf device/uboot/src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the xnu-linux toolchain container
        uses: docker/build-push-action@v6
        with:
          context: unixnu/scripts/linux
          file: device/containers/xnu-linux/Containerfile
          tags: unixnu-xnu-linux:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select the device
        working-directory: unixnu
        run: |
          ./unixnu defconfig grus_defconfig
          python3 - <<'PY'
          import os, tomllib
          board = tomllib.load(open(os.path.join(os.environ['UNIXNU_DEVICE'], 'board.toml'), 'rb'))
          print(f"board: {board['board']['name']}")
          PY

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        working-directory: unixnu
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build kernel (inside the container)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e UNIXNU_DEVICE=/work/device \
            unixnu-xnu-linux:local bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              dnf -y install -q dtc unifdef mtools >/dev/null 2>&1 || true
              cd unixnu
              ./unixnu fetch
              ./unixnu build kernel
            '

      - name: Build payload
        if: contains(inputs.steps || 'kernel', 'payload') || contains(github.event.head_commit.message, 'payload')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e UNIXNU_DEVICE=/work/device \
            unixnu-xnu-linux:local bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              dnf -y install -q dtc unifdef mtools >/dev/null 2>&1 || true
              cd unixnu
              ./unixnu build payload
            '

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          work=unixnu/out/grus/ipados-17.7.11-21H461/grus
          cp "$work"/kernel/kernel.macho artifacts/ 2>/dev/null || true
          cp "$work"/kernel/kernel.macho.json artifacts/ 2>/dev/null || true
          cp "$work"/payload/payload.img artifacts/ 2>/dev/null || true
          cp "$work"/payload/payload.json artifacts/ 2>/dev/null || true
          cp "$work"/logs/kernel.log artifacts/kernel.log 2>/dev/null || true
          cp "$work"/logs/*.log artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grus-${{ inputs.steps || 'kernel' }}-${{ github.run_number }}
          path: artifacts/*
          retention-days: 3
          if-no-files-found: error

  uboot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4

      - name: Check out U-Boot (sirius/v2.0)
        uses: actions/checkout@v4
        with:
          repository: 57UU/u-boot
          ref: sirius/v2.0
          path: uboot/src

      - name: Vendor the grus board files into U-Boot
        run: |
          cp uboot/grus/sdm710-xiaomi-grus.dts uboot/src/dts/upstream/src/arm64/qcom/
          mkdir -p uboot/src/board/xiaomi/grus
          cp uboot/grus/grus.config uboot/grus/grus.env uboot/src/board/xiaomi/grus/
          cp uboot/grus/build-grus.sh uboot/src/

      - name: Check out UniXNU (for the container sources)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the xnu-linux toolchain container
        uses: docker/build-push-action@v6
        with:
          context: unixnu/scripts/linux
          file: containers/xnu-linux/Containerfile
          tags: unixnu-xnu-linux:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build U-Boot boot-unixnu.img (in the toolchain container)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            unixnu-xnu-linux:local bash -lc '
              set -euo pipefail
              dnf install -y -q gcc-aarch64-linux-gnu bison flex bc swig openssl-devel vim-common gnutls-devel libuuid-devel >/dev/null
              cd /work/uboot/src
              HOSTCFLAGS="-I/work/containers/uboot-build" PATH="/work/containers/uboot-build:$PATH" \
                ENV_FILE="/work/uboot/grus/grus.env" IMG="/work/uboot/grus-boot-unixnu.img" ./build-grus.sh
            '

      - name: Upload U-Boot image
        uses: actions/upload-artifact@v4
        with:
          name: grus-uboot-${{ github.run_number }}
          path: uboot/grus-boot-unixnu.img
          retention-days: 30
          if-no-files-found: error
