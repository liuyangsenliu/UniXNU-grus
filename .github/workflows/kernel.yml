name: kernel

# grus (Xiaomi Mi 9 SE, SDM710) kernel build on Linux.
#
# The XNU kernel is built with the UniXNU Linux toolchain container (Fedora 44 + a patched
# LLVM, cctools ld64, MIG, iig, lzfse and the xcrun/plutil/codesign shims from
# scripts/linux of UniXNU). This avoids the macOS + Xcode requirement of the original port and
# runs on the free GitHub Linux runner.

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device repository ref (defaults to the ref of this run)
        required: false
        default: ""
      unixnu_ref:
        description: UniXNU ref to build with
        required: false
        # Pinned to the last upstream state known-good with sirius CI (2026-10-27);
        # later main force-pushed the ArmCpu submodule pin away ("not our ref").
        default: "120067ccc43ebb5e76ec62c9219a48c897052838"
      steps:
        description: Steps to build
        type: choice
        options:
          - kernel
          - kernel payload
        default: "kernel"
      pre_build:
        description: Optional shell commands run in the UniXNU checkout before the kernel build
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "board.toml"
      - "dts/**"
      - "scripts/**"
      - "package/**"
      - "kits/**"
      - "patches/**"
      - "drivers/**"
      - "uboot/**"
      - "efi/**"
      - ".github/workflows/kernel.yml"

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  UNIXNU_DEVICE: ${{ github.workspace }}/device

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref || '120067ccc43ebb5e76ec62c9219a48c897052838' }}
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.device_ref || github.ref }}
          path: device
          persist-credentials: false

      # The U-Boot submodule pin of 57UU/u-boot was force-pushed away ("not our ref").
      # The kernel/payload steps never use it (U-Boot only builds the boot image), so drop it.
      - name: Drop the unused U-Boot submodule
        run: |
          git -C device rm --cached uboot/src
          rm -rf device/uboot/src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the xnu-linux toolchain container
        uses: docker/build-push-action@v6
        with:
          context: unixnu/scripts/linux
          file: device/containers/xnu-linux/Containerfile
          tags: unixnu-xnu-linux:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select the device
        working-directory: unixnu
        run: |
          ./unixnu defconfig grus_defconfig
          python3 - <<'PY'
          import os, tomllib
          board = tomllib.load(open(os.path.join(os.environ['UNIXNU_DEVICE'], 'board.toml'), 'rb'))
          print(f"board: {board['board']['name']}")
          PY

      - name: Run pre-build steps
        if: inputs.pre_build != ''
        working-directory: unixnu
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
          DEVICE_DIR: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build kernel (inside the container)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e UNIXNU_DEVICE=/work/device \
            unixnu-xnu-linux:local bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              dnf -y install -q dtc unifdef mtools >/dev/null 2>&1 || true
              cd unixnu
              ./unixnu fetch
              ./unixnu build kernel
            '

      - name: Build payload
        if: contains(inputs.steps || 'kernel', 'payload') || contains(github.event.head_commit.message, 'payload')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e UNIXNU_DEVICE=/work/device \
            unixnu-xnu-linux:local bash -lc '
              set -euo pipefail
              git config --global --add safe.directory "*"
              dnf -y install -q dtc unifdef mtools >/dev/null 2>&1 || true
              cd unixnu
              ./unixnu build payload
            '

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          work=unixnu/out/grus/ipados-17.7.11-21H461/grus
          cp "$work"/kernel/kernel.macho artifacts/ 2>/dev/null || true
          cp "$work"/kernel/kernel.macho.json artifacts/ 2>/dev/null || true
          cp "$work"/payload/payload.img artifacts/ 2>/dev/null || true
          cp "$work"/payload/payload.json artifacts/ 2>/dev/null || true
          cp "$work"/logs/kernel.log artifacts/kernel.log 2>/dev/null || true
          cp "$work"/logs/*.log artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grus-${{ inputs.steps || 'kernel' }}-${{ github.run_number }}
          path: artifacts/*
          retention-days: 3
          if-no-files-found: error

  uboot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4

      - name: Check out U-Boot (sirius/v2.0)
        uses: actions/checkout@v4
        with:
          repository: 57UU/u-boot
          ref: sirius/v2.0
          path: uboot/src

      - name: Vendor the grus board files into U-Boot
        run: |
          cp uboot/grus/sdm710-xiaomi-grus.dts uboot/src/dts/upstream/src/arm64/qcom/
          mkdir -p uboot/src/board/xiaomi/grus
          cp uboot/grus/grus.config uboot/grus/grus.env uboot/grus/diag.patch uboot/grus/inject-main.py uboot/grus/inject-device.py uboot/grus/inject-forceboot.py uboot/grus/inject-bind.py uboot/grus/inject-dmskip.py uboot/src/board/xiaomi/grus/
          cp uboot/grus/build-grus.sh uboot/src/

      - name: Check out UniXNU (for the container sources)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the xnu-linux toolchain container
        uses: docker/build-push-action@v6
        with:
          context: unixnu/scripts/linux
          file: containers/xnu-linux/Containerfile
          tags: unixnu-xnu-linux:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build U-Boot boot-unixnu.img (in the toolchain container)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" -w /work \
            unixnu-xnu-linux:local bash -lc '
              set -euo pipefail
              dnf install -y -q gcc-aarch64-linux-gnu bison flex bc swig openssl-devel vim-common gnutls-devel libuuid-devel >/dev/null
              cd /work/uboot/src
              HOSTCFLAGS="-I/work/containers/uboot-build" PATH="/work/containers/uboot-build:$PATH" \
                ENV_FILE="/work/uboot/grus/grus.env" IMG="/work/uboot/grus-boot-unixnu.img" bash ./build-grus.sh
            '

      - name: Dump initcall order and real .config
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          B=uboot/src/workspace/build/uboot-grus
          mkdir -p artifacts
          cp "$B/.config" artifacts/dot-config 2>/dev/null || true
          ls -1 "$B" > artifacts/build-ls.txt 2>/dev/null || true
          python3 uboot/grus/dump-initcalls.py "$B/u-boot" aarch64-linux-gnu-objdump \
            > artifacts/initcalls.txt 2>&1 || true
          grep -rn "INITCALL(" uboot/src --include="*.c" --include="*.h" \
            | grep -v "include/initcall.h" | grep -v "common/board_r.c" \
            > artifacts/initcall-uses.txt 2>/dev/null || true
          head -50 artifacts/initcalls.txt || true

      - name: Upload U-Boot image
        uses: actions/upload-artifact@v4
        with:
          name: grus-uboot-${{ github.run_number }}
          path: |
            uboot/grus-boot-unixnu.img
            artifacts/initcalls.txt
            artifacts/dot-config
            artifacts/build-ls.txt
          retention-days: 30
          if-no-files-found: error

  efi:
    # The EDK II half of the boot chain: UniXNU.efi (installed as
    # \EFI\BOOT\BOOTAA64.EFI on the payload volume) and DarwinBoot.efi (the
    # grus fork in drivers/DarwinBoot -- GIC-500 pre-configuration and the
    # INTID 19 timer). `unixnu build payload` only stages the kernel side, so
    # these two binaries have to be built and copied in separately. No
    # container: MdePkg-only DSCs on a bare runner.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev bc bison flex nasm python3 clang lld llvm mtools

      - name: Fetch edk2 (Mu_Basecore)
        run: |
          git clone --depth 1 -b release/202608 https://github.com/microsoft/mu_basecore "$GITHUB_WORKSPACE/edk2"
          git -C edk2 submodule update --init --depth 1 \
            MdePkg/Library/BaseFdtLib/libfdt \
            MdePkg/Library/MipiSysTLib/mipisyst \
            BaseTools/Source/C/BrotliCompress/brotli

      - name: Build UniXNU.efi
        run: |
          cd efi
          UNIXNU_EDK2="$GITHUB_WORKSPACE/edk2" \
          UNIXNU_BUILD_DIR="$GITHUB_WORKSPACE/efi" \
            ./build.sh -b RELEASE -t CLANGPDB

      - name: Build DarwinBoot.efi (grus fork)
        run: |
          EDK2="$GITHUB_WORKSPACE/edk2"
          export WORKSPACE="$GITHUB_WORKSPACE/db"
          # DarwinBoot.inf consumes UniXNUPkg.dec (gUniXNULoaderProtocolGuid),
          # so the vendored EDK II package has to be on PACKAGES_PATH as well.
          export PACKAGES_PATH="$GITHUB_WORKSPACE/efi:$GITHUB_WORKSPACE/drivers/DarwinBoot:$EDK2"
          export EDK_TOOLS_PATH="$EDK2/BaseTools"
          export CONF_PATH="$WORKSPACE/Build/Conf"
          export PYTHON_COMMAND=python3
          export CLANG_BIN="$(dirname "$(command -v clang)")/"
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$EDK_TOOLS_PATH/Source/C/bin:$PATH"
          mkdir -p "$WORKSPACE" "$CONF_PATH"
          for f in target tools_def build_rule; do cp "$EDK_TOOLS_PATH/Conf/$f.template" "$CONF_PATH/$f.txt"; done
          # -m: only the driver (the package's Test/Validation.inf is not needed).
          build -p DarwinBootPkg/DarwinBoot.dsc -m DarwinBootPkg/Driver/DarwinBoot.inf \
            -a AARCH64 -b RELEASE -t CLANGPDB -n "$(nproc)"

      - name: Try to grab this run's payload volume
        id: payload
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: grus-kernel*
          path: payload-art
          merge-multiple: true

      - name: Collect EFI binaries and patch the payload volume
        run: |
          set -euo pipefail
          mkdir -p efi-out
          cp "$GITHUB_WORKSPACE/efi/Build/Out/AARCH64-RELEASE/UniXNU.efi" efi-out/UniXNU.efi
          DB=$(find "$GITHUB_WORKSPACE/db" -name 'DarwinBoot.efi' | head -1)
          test -n "$DB" || { echo "DarwinBoot.efi missing"; exit 1; }
          cp "$DB" efi-out/DarwinBoot.efi
          ls -l efi-out
          if [ -f payload-art/payload.img ]; then
            mmd -i payload-art/payload.img ::/EFI/BOOT || true
            mcopy -o -i payload-art/payload.img efi-out/UniXNU.efi ::/EFI/BOOT/BOOTAA64.EFI
            mcopy -o -i payload-art/payload.img efi-out/DarwinBoot.efi ::/EFI/UniXNU/Payloads/DarwinBoot.efi
            : > marker
            mcopy -o -i payload-art/payload.img marker ::/EFI/UniXNU/BOOTUNIXNU
            mdir -i payload-art/payload.img ::/EFI
            mdir -i payload-art/payload.img ::/EFI/BOOT
            mdir -i payload-art/payload.img ::/EFI/UniXNU/Payloads
          else
            echo "no payload.img in this run; only the EFI binaries are uploaded"
          fi

      - name: Upload EFI binaries (and the patched payload, if any)
        uses: actions/upload-artifact@v4
        with:
          name: grus-efi-${{ github.run_number }}
          path: |
            efi-out/*
            payload-art/payload.img
          retention-days: 14
          if-no-files-found: warn
